services:
  grafana:
    user: root
    container_name: jaegertracing-grafana
    build:
      context: packages/panel/.config
      dockerfile: Dockerfile
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana}
        grafana_version: ${GRAFANA_VERSION:-12.4.0}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 3000:3000/tcp
    volumes:
      - ./packages/panel/dist:/var/lib/grafana/plugins/jaegertracing-jaeger-panel
      - ./packages/datasource/dist:/var/lib/grafana/plugins/jaegertracing-jaeger-datasource
      - ./provisioning:/etc/grafana/provisioning
    environment:
      NODE_ENV: development
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: jaegertracing-jaeger-panel,jaegertracing-jaeger-datasource

  jaeger:
    # Default is a snapshot build identified by its git SHA tag (immutable — not republished).
    # Override the full image reference to use a release or different snapshot, e.g.:
    #   JAEGER_IMAGE=jaegertracing/jaeger:2.18.0 make server
    image: ${JAEGER_IMAGE:-jaegertracing/jaeger-snapshot:6102e1d23f6a6e7db76e8a595b94a12c55b35a86@sha256:753cfde09e32f6ced9794bbc397974bbbed5128a6ff5756844e8b46531b3cbd6}
    container_name: jaegertracing-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  hotrod:
    image: ${HOTROD_IMAGE:-jaegertracing/example-hotrod:2.18.0@sha256:61627c2d827bae3ba2e09c90c447272f3e642fe6eadc2f1fca6b542d45a9ea56}
    container_name: jaegertracing-hotrod
    ports:
      - "8080:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      - jaeger
